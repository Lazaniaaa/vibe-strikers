<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibe Strikers rewards admin</title>
    <style>
      :root { --ink: #253644; --cream: #fffcf4; --acc: #ffb83d; --muted: #5d6b76; --bad: #c0392b; --ok: #2e8b57; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #e6f3f2; color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
      main { max-width: 980px; margin: 0 auto; padding: 16px; }
      h1 { margin: 8px 0 4px; font-size: 24px; }
      .warn { background: #fff0d2; border: 2px solid var(--acc); border-radius: 10px; padding: 8px 12px; margin: 8px 0 16px; }
      section { background: var(--cream); border: 2px solid var(--ink); border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
      h2 { margin: 0 0 8px; font-size: 16px; }
      label { display: inline-flex; gap: 6px; align-items: center; margin: 4px 12px 4px 0; }
      input { font: inherit; padding: 4px 6px; border: 2px solid var(--ink); border-radius: 6px; background: #fff; }
      input.wide { width: 420px; max-width: 100%; }
      button { font: inherit; font-weight: 700; padding: 6px 12px; border: 2px solid var(--ink); border-radius: 8px; background: var(--acc); cursor: pointer; margin: 4px 6px 4px 0; }
      button:disabled { opacity: .45; cursor: default; }
      .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; }
      .kv b { font-weight: 600; color: var(--muted); }
      code { font-size: 12px; word-break: break-all; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
      th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid #d9d2c0; }
      th { color: var(--muted); font-weight: 600; }
      #log { white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; max-height: 260px; overflow: auto; background: #fff; border: 1px solid #d9d2c0; border-radius: 6px; padding: 6px; }
      .bad { color: var(--bad); } .ok { color: var(--ok); }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/admin/main.ts"></script>
  </body>
</html>
