<!doctype html><html lang="uk"><meta charset="utf-8"><title>Toy Town · до / після</title><style>body{margin:24px;background:#17233a;color:#f1e1bc;font:16px 'Segoe UI',sans-serif}h1{font-size:24px}a{color:#2ce8f5}canvas{width:min(1600px,100%);height:auto;display:block;margin:20px 0}#individual{display:flex;gap:18px;flex-wrap:wrap}</style><h1>Toy Town · ті самі 4 ракурси</h1><p>Зліва — початкові кольори; справа — Endesga 32, нове світло й декор. Спавн A, спавн B, фонтан, ринок. Камери, FOV 70° та ACES / sRGB однакові.</p><p><a href="./colour.html">Відкрити 3D-перегляд</a> · <a id="export">↓ PNG · до / після</a></p><div id="individual"></div><canvas width="1600" height="2000"></canvas><script type="module">
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),root='../reports/colour/';let row=0;for(const view of['spawn-a','spawn-b','fountain','market']){let col=0;for(const stage of['before','after']){const file=stage+'-'+view+'.png',img=new Image();img.src=root+file;await img.decode();ctx.drawImage(img,col*800,row*500,800,500);const a=document.createElement('a');a.href=root+file;a.textContent=file;document.querySelector('#individual').append(a);col++;}row++;}const a=document.querySelector('#export');a.href=canvas.toDataURL('image/png');a.download='before-after.png';a.dataset.file='before-after.png';
</script></html>
